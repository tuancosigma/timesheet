kimai:
    theme:
        branding:
            logo: '/cosigma-logo.png'
            company: 'Cosigma'
    saml:
        activate: true
        title: "Microsoft 365"
        provider: microsoft
        mapping:
            - { kimai: email, saml: "$http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress" }
            - { kimai: alias, saml: "$http://schemas.microsoft.com/identity/claims/displayname" }
        roles:
            attribute: "http://schemas.microsoft.com/ws/2008/06/identity/claims/role"
            mapping:
                - { saml: "Admin", kimai: ROLE_SUPER_ADMIN }
                - { saml: "User", kimai: ROLE_USER }
        connection:
            baseurl: 'https://time.cosigma.io/auth/saml'
            strict: false
            debug: true
            idp:
                entityId: "https://sts.windows.net/d8fab091-9852-41e1-8300-057ce10d3ca9/"
                singleSignOnService:
                    url: "https://login.microsoftonline.com/d8fab091-9852-41e1-8300-057ce10d3ca9/saml2"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
                x509cert: ""
            sp:
                entityId: "https://time.cosigma.io/auth/saml/metadata"
                assertionConsumerService:
                    url: "https://time.cosigma.io/auth/saml/acs"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
                singleLogoutService:
                    url: "https://time.cosigma.io/auth/saml/logout"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
    permissions:
        roles:
            ROLE_USER: 
                - 'view_project'
                - 'view_activity'
                - 'view_customer'
                - 'view_team_project'
                - 'view_team_activity'
                - 'view_team_customer'
                - 'time_project'
                - 'time_activity'
                - 'time_customer'
        sets:
            INVOICE: []
            INVOICE_ADMIN: []
            INVOICE_ALL: []
